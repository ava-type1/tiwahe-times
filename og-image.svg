<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF6F0"/>
  
  <!-- Top border -->
  <rect x="40" y="40" width="1120" height="6" fill="#6B4226"/>
  <rect x="40" y="50" width="1120" height="2" fill="#6B4226"/>
  
  <!-- Title -->
  <text x="600" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold" fill="#1a1a1a" letter-spacing="-2">THE TIWAHE TIMES</text>
  
  <!-- Subtitle -->
  <text x="600" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#6B4226" font-style="italic">Fort White, Florida's Community Digest</text>
  
  <!-- Rule -->
  <line x1="200" y1="320" x2="1000" y2="320" stroke="#c8b89a" stroke-width="1"/>
  
  <!-- Tagline -->
  <text x="600" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#444">Local News · Weather · Events · Sports</text>
  
  <!-- Bottom accent -->
  <text x="600" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#777">Columbia County, Florida</text>
  
  <!-- Bottom border -->
  <rect x="40" y="578" width="1120" height="2" fill="#6B4226"/>
  <rect x="40" y="584" width="1120" height="6" fill="#6B4226"/>
</svg>
